<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Arapiraca em Indicadores</title>
  <meta name="description" content="Gráficos de 6 indicadores públicos de Arapiraca-AL: educação, saúde e desenvolvimento econômico. Projeto Integrador, UNEAL.">
  <meta name="theme-color" content="#1E1D2B">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css?v=9">
</head>
<body>

<div class="app">

  <aside class="side" id="side" aria-label="Navegação">
    <div class="side__logo">
      <img src="assets/logo-uneal.png" alt="UNEAL">
    </div>
    <nav class="side__nav" id="nav"></nav>
  </aside>

  <div class="conteudo">
    <header class="topo">
      <button type="button" class="topo__menu" id="menu" aria-label="Mostrar menu" aria-controls="side" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <label class="busca">
        <span class="sr">Pesquisar indicador</span>
        <input type="search" id="busca" placeholder="Procurar indicador..." autocomplete="off">
        <span class="busca__btn" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </span>
      </label>
      <p class="topo__info">Arapiraca · <span id="atualizado"></span></p>
    </header>

    <main class="principal">
      <h1 class="principal__titulo" id="titulo">Dashboard</h1>
      <div class="grid" id="grid"></div>
      <p class="vazio" id="vazio" hidden>Nenhum indicador encontrado.</p>
    </main>
  </div>

</div>

<script src="data/kpis.js?v=9"></script>
<script src="data/analises.js?v=9"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="assets/app.js?v=9"></script>
<script src="assets/analises.js?v=9"></script>
</body>
</html>
